# Приложение («Настройки» → «Написать разработчику» → GitHub) заполняет device:
# issues/new?template=bug.yml&device=…
name: Ошибка
description: Что-то не работает, вылетает или ведёт себя странно.
title: "ошибка: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Обсуждение открытое — всё, что здесь написано, видно всем. Не прикладывайте снимки экрана с личными разговорами.
  - type: textarea
    id: what
    attributes:
      label: Что случилось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Что нажимали перед этим, если помните.
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
  - type: input
    id: device
    attributes:
      label: Версия и телефон
      placeholder: Falar 0.26.1 · Xiaomi Redmi Note 10 Pro · Android 13
